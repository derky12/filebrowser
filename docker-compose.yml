# Private deployment. The same file serves the amd64 and the arm64 machine.
#
# Everything that differs per machine lives in .env: the architecture, the
# Tailscale address, the ports, the folder to serve. Create it once with
#   scripts/init-env.sh
# (it detects the architecture and the Tailscale address and makes the key), or
# copy .env.example by hand. Do NOT write this file or .env with an unquoted
# heredoc (cat << EOF): the shell would replace every ${...} below on the spot.
# Then:
#   docker compose -f docker-compose.yml pull && docker compose -f docker-compose.yml up -d
# (-f is required: the repo also ships the upstream compose.yaml, which wins otherwise.)
# See the README for how folder syncing works.
services:
  filebrowser:
    image: q25459768/filebrowser:latest
    platform: linux/${ARCH}
    container_name: filebrowser
    restart: unless-stopped
    depends_on:
      - syncthing
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - FB_NOAUTH=true
      - FB_SYNCTHING_URL=http://syncthing:8384
      - FB_SYNCTHING_API_KEY=${SYNCTHING_API_KEY}
      - FB_SYNCTHING_PRIVATE_NETWORK=true
      - FB_SYNCTHING_PORT=${SYNC_PORT}
      - FB_SYNCTHING_GUI_PORT=${SYNCTHING_GUI_PORT}
      # WebDAV (optional, off unless WEBDAV_ENABLED=true): the container always
      # listens on 8090; the published port is WEBDAV_PORT below.
      - FB_WEBDAV_ENABLED=${WEBDAV_ENABLED:-false}
      - FB_WEBDAV_PORT=8090
      - FB_WEBDAV_HOST_PORT=${WEBDAV_PORT:-38004}
      - FB_WEBDAV_USER=${WEBDAV_USER:-webdav}
      - FB_WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      - FB_WEBDAV_PREFIX=${WEBDAV_PREFIX:-}
      - FB_WEBDAV_PUBLIC_URL=${WEBDAV_PUBLIC_URL:-}
      - FB_WEBDAV_BEHIND_PROXY=${WEBDAV_BEHIND_PROXY:-false}
    ports:
      - "${HOST_IP}:${WEB_PORT}:80"
      # WebDAV. Without WEBDAV_BIND_IP it is only reachable from this machine
      # (127.0.0.1); set it to HOST_IP to reach it over Tailscale, or keep it
      # local when a proxy on this machine does HTTPS (see the README).
      - "${WEBDAV_BIND_IP:-127.0.0.1}:${WEBDAV_PORT:-38004}:8090"
    volumes:
      - ${DATA_DIR}:/srv
      - ./config:/config
      - ./database:/database
    tmpfs:
      - /srv/.ssh:ro,size=4k,mode=0555

  syncthing:
    image: syncthing/syncthing:2
    platform: linux/${ARCH}
    container_name: filebrowser-syncthing
    hostname: ${SYNCTHING_NAME}
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - STGUIADDRESS=0.0.0.0:8384
      - STGUIAPIKEY=${SYNCTHING_API_KEY}
      - STNODEFAULTFOLDER=1
    ports:
      - "${HOST_IP}:${SYNCTHING_GUI_PORT}:8384"
      - "${HOST_IP}:${SYNC_PORT}:22000/tcp"
      - "${HOST_IP}:${SYNC_PORT}:22000/udp"
      - "${HOST_IP}:${DISCOVERY_PORT}:21027/udp"
    volumes:
      - ${DATA_DIR}:/srv
      - ./syncthing-config:/var/syncthing/config
    tmpfs:
      - /srv/.ssh:ro,size=4k,mode=0555
