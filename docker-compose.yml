services:
  filebrowser:
    image: q25459768/filebrowser:amd64
    container_name: filebrowser
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - FB_NOAUTH=true
    ports:
      - "100.64.0.7:38002:80" #修改成实际地址
    volumes:
      - /root:/srv
      - ./config:/config
      - ./database:/database
