# Private deployment. The same file serves the amd64 and the arm64 machine.
#
# Everything that differs per machine lives in .env: the architecture, the
# Tailscale address, the ports, the folder to serve. Create it once with
#   scripts/init-env.sh
# (it detects the architecture and the Tailscale address and makes the key), or
# copy .env.example by hand. Do NOT write this file or .env with an unquoted
# heredoc (cat << EOF): the shell would replace every ${...} below on the spot.
# Then:
#   docker compose -f docker-compose.yml pull && docker compose -f docker-compose.yml up -d
# (-f is required: the repo also ships the upstream compose.yaml, which wins otherwise.)
# See the README for how folder syncing works.
services:
  filebrowser:
    # The tag has an amd64 and an arm64 image; Docker takes the one of `platform`.
    image: q25459768/filebrowser:${FB_TAG:-latest}
    platform: linux/${ARCH:?set ARCH in .env (amd64 or arm64)}
    container_name: filebrowser
    restart: unless-stopped
    depends_on:
      - syncthing
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - FB_NOAUTH=true
      - FB_SYNCTHING_URL=http://syncthing:8384
      - FB_SYNCTHING_API_KEY=${SYNCTHING_API_KEY:?set SYNCTHING_API_KEY in .env}
      - FB_SYNCTHING_PRIVATE_NETWORK=true
      # Port assumed for device addresses entered without one; keep it equal to SYNC_PORT.
      - FB_SYNCTHING_PORT=${SYNC_PORT:-23000}
    ports:
      - "${HOST_IP:?set HOST_IP in .env}:${WEB_PORT:-38002}:80"
    volumes:
      - ${DATA_DIR:-/root}:/srv
      - ./config:/config
      - ./database:/database
    # The served folder may be a home directory, so hide ~/.ssh: an empty
    # read-only tmpfs covers it inside the container (the real directory on the
    # host is not touched). Add more lines like this for other secrets, e.g.
    # /srv/.gnupg.
    tmpfs:
      - /srv/.ssh:ro,size=4k,mode=0555

  # Does the actual syncing. File Browser is the UI for it, but Syncthing's own
  # web interface is published too, on SYNCTHING_GUI_PORT. It has no password
  # until you set one in its Settings > GUI, so keep it on the Tailscale address.
  syncthing:
    image: syncthing/syncthing:2
    platform: linux/${ARCH:?set ARCH in .env (amd64 or arm64)}
    container_name: filebrowser-syncthing
    hostname: ${SYNCTHING_NAME:-filebrowser} # the device name the other side sees; differs per machine
    restart: unless-stopped
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - STGUIADDRESS=0.0.0.0:8384
      - STGUIAPIKEY=${SYNCTHING_API_KEY:?set SYNCTHING_API_KEY in .env}
      - STNODEFAULTFOLDER=1
    ports:
      # host port : container port. Change the host ports in .env, never the
      # container ports.
      - "${HOST_IP:?set HOST_IP in .env}:${SYNCTHING_GUI_PORT:-38003}:8384"
      - "${HOST_IP:?set HOST_IP in .env}:${SYNC_PORT:-23000}:22000/tcp"
      - "${HOST_IP:?set HOST_IP in .env}:${SYNC_PORT:-23000}:22000/udp"
      - "${HOST_IP:?set HOST_IP in .env}:${DISCOVERY_PORT:-23001}:21027/udp"
    volumes:
      - ${DATA_DIR:-/root}:/srv # must be the same folder as File Browser's
      - ./syncthing-config:/var/syncthing/config
    tmpfs:
      - /srv/.ssh:ro,size=4k,mode=0555
