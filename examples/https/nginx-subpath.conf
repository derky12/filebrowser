# One host, WebDAV under /dav/ (set WEBDAV_PREFIX=/dav and
# WEBDAV_PUBLIC_URL=https://example.ts.net/dav in .env). The prefix is NOT
# stripped by nginx: the WebDAV server needs it to build and read URLs.
server {
    listen 443 ssl;
    server_name example.ts.net;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_http_version 1.1;

    location /dav/ {
        # No URI part after the address: nginx passes the path through as it is.
        proxy_pass http://filebrowser:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://filebrowser:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
