# Adds nginx for HTTPS. Use it together with the main file:
#   docker compose -f docker-compose.yml -f examples/https/docker-compose.nginx.yml up -d
#
# In .env: WEBDAV_BIND_IP=127.0.0.1, WEBDAV_BEHIND_PROXY=true and
# WEBDAV_PUBLIC_URL=https://dav.example.ts.net
# Certificate and key: ./examples/https/certs/fullchain.pem and privkey.pem,
# for example made with `tailscale cert --cert-file fullchain.pem --key-file privkey.pem dav.example.ts.net`.
services:
  nginx:
    image: nginx:1
    restart: unless-stopped
    depends_on:
      - filebrowser
    ports:
      - "${HOST_IP}:443:443"
    volumes:
      - ./examples/https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./examples/https/certs:/certs:ro
