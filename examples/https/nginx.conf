# nginx in front of the WebDAV server and the web interface.
# Put the certificate and key (for example from `tailscale cert dav.example.ts.net`)
# in ./certs and mount that folder at /certs (see docker-compose.nginx.yml).

# Needed by every WebDAV server behind nginx, explained next to each line.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name dav.example.ts.net;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    # Uploads can be as large as you like: 0 turns the limit off (the default
    # 1m makes big PUT requests fail with 413).
    client_max_body_size 0;
    # Stream uploads and downloads instead of buffering them on disk first.
    proxy_request_buffering off;
    proxy_buffering off;
    # Long transfers.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # WebDAV uses HTTP/1.1.
    proxy_http_version 1.1;

    location / {
        proxy_pass http://filebrowser:8090;

        # MUST be the host the client used. MOVE and COPY carry a Destination
        # header with that host, and the WebDAV server answers 502 when the
        # Host it sees is different. nginx's default would send the upstream's
        # name, which breaks renaming and moving files while uploads and
        # downloads keep working.
        proxy_set_header Host $http_host;

        # The client address, for the activity log and the wrong-password
        # limit (set WEBDAV_BEHIND_PROXY=true). $proxy_add_x_forwarded_for
        # appends the real address as the last entry, which is the one trusted.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name files.example.ts.net;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://filebrowser:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The web interface uses a websocket for the command runner.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
